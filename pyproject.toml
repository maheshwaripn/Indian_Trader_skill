[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indian-trader-skill"
version = "0.2.1"
description = "Local-first Indian equity research, paper accounting and AI coaching"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Prashant Maheshwari"}]
dependencies = []

[project.optional-dependencies]
parquet = ["pyarrow>=17,<24"]
yahoo = ["yfinance>=0.2.54,<1"]

[project.scripts]
indian-trader = "indian_trader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
indian_market_core = ["data/*.json"]

[tool.ruff]
line-length = 240

[tool.ruff.lint]
# Pyflakes plus syntax-level pycodestyle checks. The codebase keeps short statements on one line, so E701/E702 are allowed.
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["E701", "E702", "E731", "E741", "B905"]
